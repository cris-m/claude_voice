name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Later steps run third-party code; don't leave a write token in .git.
          persist-credentials: false

      - name: Check the tag matches plugin.json
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version. Cut releases with tools/release.py."
            exit 1
          fi

      - name: Validate the plugin
        # Pinned: an unpinned package would run whatever is latest at release time.
        run: npx -y @anthropic-ai/claude-code@2.1.332 plugin validate --strict .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
